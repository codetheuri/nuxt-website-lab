services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuxt-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_SITE_NAME: ${NUXT_PUBLIC_SITE_NAME:-Acme Digital}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_API_BASE_URL: http://vuelab-api:4000
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    external: true